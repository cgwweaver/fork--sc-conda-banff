# Fork-only helper to check recipes/banff before it is submitted to
# conda-forge/staged-recipes. Do NOT copy this file into the staged-recipes PR.
#
# - prints the sha256 of the GitHub release tarball (and fills it in for this
#   run if the recipe still has the placeholder)
# - runs the conda-forge linter
# - builds and tests linux-64 for every Python variant, inside the same Docker
#   image conda-forge's CI uses
name: banff recipe check

on:
  pull_request:
    paths:
      - "recipes/banff/**"
      - ".github/workflows/banff-recipe-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-64:
    runs-on: ubuntu-latest
    container:
      image: quay.io/condaforge/linux-anvil-x86_64:alma9
      options: --user root
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: tools
          create-args: >-
            rattler-build
            conda-smithy
            conda-forge-pinning
          condarc: |
            channels:
              - conda-forge

      - name: sha256 of the GitHub release tarball
        run: |
          version=$(sed -n 's/^  version: "\(.*\)"$/\1/p' recipes/banff/recipe.yaml | head -1)
          url="https://github.com/StatCan/gensol-banff/archive/refs/tags/${version}.tar.gz"
          curl -sSfL -o src.tar.gz "$url"
          sha=$(sha256sum src.tar.gz | cut -d' ' -f1)
          rm src.tar.gz
          echo "sha256 of ${url}: ${sha}" | tee -a "$GITHUB_STEP_SUMMARY"
          sed -i "s/TODO_REPLACE_WITH_GITHUB_TARBALL_SHA256/${sha}/" recipes/banff/recipe.yaml

      - name: Lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: conda-smithy recipe-lint --conda-forge recipes/banff

      - name: Build and test
        run: |
          rattler-build build \
            --recipe recipes/banff/recipe.yaml \
            -m "${CONDA_PREFIX}/conda_build_config.yaml" \
            -m .ci_support/linux64.yaml \
            --output-dir build_artifacts
